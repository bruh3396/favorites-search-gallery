<div id="tag-editor-container">
  <div id="tag-editor-option-container">
    <label class="opt-checkbox" title="Add or remove custom or official tags to favorites">
      <input type="checkbox" id="tag-editor-option-checkbox">Edit Tags<span class="u-opt-hint"></span>
    </label>
  </div>
  <div id="tag-editor-ui-container">
    <label id="tag-editor-ui-status-label">No Status</label>
    <textarea id="tag-editor-ui-textarea" placeholder="tags" spellcheck="false"></textarea>
    <div id="tag-editor-buttons">
      <span id="tag-editor-ui-modification-buttons">
        <button id="tag-editor-ui-add" title="Add tags to selected favorites">Add</button>
        <button id="tag-editor-remove" title="Remove tags from selected favorites">Remove</button>
      </span>
      <span id="tag-editor-ui-selection-buttons">
        <button id="tag-editor-ui-select-all" title="Select all favorites for tag modification">Select all</button>
        <button id="tag-editor-ui-un-select-all" title="Unselect all favorites for tag modification">Unselect
          all</button>
      </span>
    </div>
    <div id="tag-editor-ui-reset-button-container">
      <button id="tag-editor-reset" title="Reset tag modifications">Reset</button>
    </div>
    <div id="tag-editor-ui-configuration" style="display: none;">
      <button id="tag-editor-import" title="Import modified tags">Import</button>
      <button id="tag-editor-export" title="Export modified tags">Export</button>
    </div>
  </div>
</div>

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm run verify

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(grep -m1 '^// @version' dist/rule34/favorites_search_gallery.js | tr -d '\r' | awk '{print $3}')
          echo "tag=$tag built=$built"
          test "$tag" = "$built"

      - run: cp dist/rule34/favorites_search_gallery.js "dist/rule34/favorites_search_gallery_${GITHUB_REF_NAME}.js"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/rule34/favorites_search_gallery_${{ github.ref_name }}.js
          generate_release_notes: true
